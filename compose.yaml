services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: boarding_pass
      DB_PASSWORD: boarding_pass
      DB_NAME: boarding_pass
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 512m
    cpus: 2
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 55s
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: boarding_pass
      POSTGRES_PASSWORD: boarding_pass
      POSTGRES_DB: boarding_pass
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boarding_pass -d boarding_pass"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 256m
volumes:
  postgres-data:
