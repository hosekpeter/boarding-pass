name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: boarding_pass
          POSTGRES_PASSWORD: boarding_pass
          POSTGRES_DB: boarding_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boarding_pass -d boarding_pass"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://boarding_pass:boarding_pass@127.0.0.1:5432/boarding_pass?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: go vet -tags=integration ./...
      - run: go test -race -tags=integration -coverpkg=./... -coverprofile=coverage.out ./...
