name: boarding-pass-tests
services:
  check:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://boarding_pass:boarding_pass@db:5432/boarding_pass_test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: boarding_pass
      POSTGRES_PASSWORD: boarding_pass
      POSTGRES_DB: boarding_pass_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boarding_pass -d boarding_pass_test"]
      interval: 2s
      timeout: 3s
      retries: 15
